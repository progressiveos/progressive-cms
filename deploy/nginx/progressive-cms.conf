# only when provision-site.sh runs with PROVISION_PROFILE=local-nginx).
#
# The default profile is external-rp
# terminates TLS and connects DIRECTLY to the declared application endpoint
# (the instance's stable private address, HTTP_HOST) — no nginx inside the
# application container and no relay layer.
# This vhost exists for standalone/single-host installs without an external
# in front of it.
#
# Set __SITE_HOST__ to the site's domain during installation.
#
# The web process honors X-Forwarded-Proto/For ONLY from configured
# trustedProxies (config http.trustedProxies = 127.0.0.1 — this nginx); the
# external RP's scheme travels inside X-Forwarded-Proto and is passed through
# unchanged (proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto).

# auth-semantics authority; this is coarse edge protection).
limit_req_zone $binary_remote_addr zone=pcms_edge:10m rate=50r/s;

server {
    listen 80;
    server_name __SITE_HOST__;

    client_max_body_size 35m;          # API accepts 32 MiB binary bodies + margin
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # The application emits the same baseline; nginx-level copies guarantee
    # them even for nginx-generated responses (redirects, emergency page).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # NOT the CMS maintenance mode: this renders only when the Node upstream
    # is unreachable (502/504) or nginx itself answers 503 (e.g. rate limit).
    # A 503 produced BY the app (CMS maintenance mode) passes through untouched
    # (proxy_intercept_errors stays off).
    # sees "temporarily unavailable", never a hard 502 machine error.
    error_page 502 504 =503 /_pcms_emergency_maintenance.html;

    location = /_pcms_emergency_maintenance.html {
        root /var/www/progressive-cms-emergency;
        internal;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # Theme assets use the Web public-assets gate; nginx never reads theme files.
    location /themes/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/progressive-cms-proxy.conf;
    }

    # --- auth edge limit: coarse burst control on the credential surface ----
    location /api/v1/auth/ {
        limit_req zone=pcms_edge burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/progressive-cms-proxy.conf;
    }

    # --- everything else: transparent proxy to the web process --------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/progressive-cms-proxy.conf;
    }
}
